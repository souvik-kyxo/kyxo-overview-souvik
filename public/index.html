<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>My To-Do List</h1>
    </header>

    <main>
      <section class="input-section">
        <form id="taskForm">
          <div class="form-group">
            <input
              type="text"
              id="taskInput"
              placeholder="Add a new task..."
              required
            >
            <input
              type="date"
              id="dueDateInput"
              class="due-date-input"
            >
            <div class="category-input-wrapper">
              <input
                type="text"
                id="categoryInput"
                placeholder="Add category (comma-separated)"
                class="category-input"
              >
              <div id="categorySuggestions" class="category-suggestions"></div>
            </div>
            <button type="submit" class="btn btn-primary">Add Task</button>
          </div>
        </form>
      </section>

      <section class="filter-section">
        <div class="filter-header-row">
          <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            class="search-input"
          >
          <button class="btn-view-toggle" onclick="app.toggleGroupByCategory()" title="Toggle grouped by category view">📂</button>
          <button class="btn-manage-categories" onclick="app.toggleCategoryManager()" title="Manage categories">⚙️</button>
        </div>
        <div id="categoryFilters" class="category-filters"></div>
      </section>

      <div id="categoryManager" class="category-manager hidden">
        <div class="category-manager-header">
          <h3>Manage Categories</h3>
          <button class="btn-close" onclick="app.toggleCategoryManager()">✕</button>
        </div>
        <div class="category-manager-content">
          <div class="add-category-form">
            <h4>Add New Category</h4>
            <div class="add-category-inputs">
              <input
                type="text"
                id="newCategoryName"
                placeholder="Category name"
                class="new-category-input"
              >
              <input
                type="color"
                id="newCategoryColor"
                class="new-category-color"
                value="#667eea"
              >
              <button class="btn btn-primary" onclick="app.addNewCategory()">Add</button>
            </div>
          </div>
          <div class="categories-list">
            <h4>Existing Categories</h4>
            <div id="categoriesListContent" class="categories-list-content"></div>
          </div>
        </div>
      </div>

      <section class="tasks-section">
        <div id="tasksContainer" class="tasks-list">
          <p id="emptyState" class="empty-state">No tasks yet. Add one to get started!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
