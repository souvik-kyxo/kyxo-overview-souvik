<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="authContainer" class="auth-container" style="display: none;">
    <div class="auth-box">
      <h1>To-Do List</h1>
      <form id="authForm" class="auth-form">
        <div class="form-group">
          <label for="authEmail">Email:</label>
          <input
            type="email"
            id="authEmail"
            placeholder="you@example.com"
            required
          >
        </div>
        <div class="form-group">
          <label for="authPassword">Password:</label>
          <input
            type="password"
            id="authPassword"
            placeholder="At least 8 characters"
            required
          >
        </div>
        <div class="auth-buttons">
          <button type="button" class="btn btn-primary" id="loginBtn">Login</button>
          <button type="button" class="btn btn-secondary" id="registerBtn">Sign Up</button>
        </div>
      </form>
    </div>
  </div>

  <div id="appContainer" class="container" style="display: none;">
    <header>
      <div class="header-content">
        <h1>My To-Do List</h1>
        <div class="user-info">
          <span id="userEmail"></span>
          <button id="logoutBtn" class="btn btn-logout">Logout</button>
        </div>
      </div>
    </header>

    <main>
      <section class="input-section">
        <form id="taskForm">
          <div class="form-group">
            <input
              type="text"
              id="taskInput"
              placeholder="Add a new task..."
              required
            >
            <input
              type="date"
              id="dueDateInput"
              class="due-date-input"
            >
            <button type="submit" class="btn btn-primary">Add Task</button>
          </div>
        </form>
      </section>

      <section class="filter-section">
        <input
          type="text"
          id="searchInput"
          placeholder="Search tasks..."
          class="search-input"
        >
      </section>

      <section class="tasks-section">
        <div id="tasksContainer" class="tasks-list">
          <p id="emptyState" class="empty-state">No tasks yet. Add one to get started!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
