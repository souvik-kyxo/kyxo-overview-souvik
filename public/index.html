<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>My To-Do List</h1>
    </header>

    <main>
      <section class="input-section">
        <form id="taskForm">
          <div class="form-group">
            <input
              type="text"
              id="taskInput"
              placeholder="Add a new task..."
              required
            >
            <input
              type="date"
              id="dueDateInput"
              class="due-date-input"
            >
            <input
              type="text"
              id="categoryInput"
              placeholder="Add category (comma-separated)"
              class="category-input"
            >
            <button type="submit" class="btn btn-primary">Add Task</button>
          </div>
        </form>
      </section>

      <section class="filter-section">
        <input
          type="text"
          id="searchInput"
          placeholder="Search tasks..."
          class="search-input"
        >
        <div id="categoryFilters" class="category-filters"></div>
      </section>

      <section class="tasks-section">
        <div id="tasksContainer" class="tasks-list">
          <p id="emptyState" class="empty-state">No tasks yet. Add one to get started!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
