<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="authSection" class="auth-container" style="display: none;">
    <div class="auth-card">
      <h1>To-Do List</h1>

      <div id="loginTab" class="tab-content">
        <h2>Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
          <p class="auth-toggle">Don't have an account? <a href="#" onclick="app.switchToRegister()">Register</a></p>
        </form>
        <div id="loginError" class="error-message"></div>
      </div>

      <div id="registerTab" class="tab-content" style="display: none;">
        <h2>Create Account</h2>
        <form id="registerForm">
          <div class="form-group">
            <label for="registerUsername">Username</label>
            <input type="text" id="registerUsername" required>
          </div>
          <div class="form-group">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" required>
          </div>
          <div class="form-group">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" required>
          </div>
          <button type="submit" class="btn btn-primary">Register</button>
          <p class="auth-toggle">Already have an account? <a href="#" onclick="app.switchToLogin()">Login</a></p>
        </form>
        <div id="registerError" class="error-message"></div>
      </div>
    </div>
  </div>

  <div id="appSection" class="container" style="display: none;">
    <header>
      <h1>My To-Do List</h1>
      <button id="logoutBtn" class="btn btn-secondary" onclick="app.logout()">Logout</button>
    </header>

    <main>
      <section class="input-section">
        <form id="taskForm">
          <div class="form-group">
            <input
              type="text"
              id="taskInput"
              placeholder="Add a new task..."
              required
            >
            <input
              type="date"
              id="dueDateInput"
              class="due-date-input"
            >
            <button type="submit" class="btn btn-primary">Add Task</button>
          </div>
        </form>
      </section>

      <section class="stats-section">
        <div class="stat-card">
          <div class="stat-value" id="totalTasks">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="completedTasks">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="overdueTasks">0</div>
          <div class="stat-label">Overdue</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="inProgressTasks">0</div>
          <div class="stat-label">In Progress</div>
        </div>
      </section>

      <section class="filter-section">
        <div class="filter-controls">
          <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            class="search-input"
          >
          <select id="priorityFilter" class="filter-select">
            <option value="">All Priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <select id="statusFilter" class="filter-select">
            <option value="">All Statuses</option>
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
          <select id="sortSelect" class="filter-select">
            <option value="createdAt">Created Date</option>
            <option value="priority">Priority</option>
            <option value="dueDate">Due Date</option>
            <option value="title">Title (A-Z)</option>
          </select>
        </div>
      </section>

      <section class="tasks-section">
        <div id="tasksContainer" class="tasks-list">
          <p id="emptyState" class="empty-state">No tasks yet. Add one to get started!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
